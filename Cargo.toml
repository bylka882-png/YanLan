[package]
name = "yanlan"
version = "1.5.0"
edition = "2021"
description = "Неофициальный лаунчер Yandere Simulator: отдельные сборки, моды и архив версий"
authors = ["Archangel192028"]
license = "CC-BY-NC-4.0"
readme = "README.md"
publish = false

[package.metadata]
# Файлы, которые имеет смысл прикладывать к релизу.
release-files = ["yanlan.exe", "README.md", "CHANGELOG.md", "LICENSE.md"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
ureq = { version = "2.10", features = ["json", "tls", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
unrar = "0.5"
# Чистый Rust-разбор 7z: LZMA/LZMA2, PPMd, Deflate, BZip2.
zesven = { version = "3.2", default-features = false, features = [
    "lzma",
    "lzma2",
    "deflate",
    "bzip2",
    "ppmd",
] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
percent-encoding = "2"
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
